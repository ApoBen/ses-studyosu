[project]
name = "ses-modeli"
version = "0.1.0"
description = "Lokal Türkçe ses modeli: TTS, Türkçe prozodi planlayıcı, ses klonlama ve VC"
readme = "ai.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "gradio>=5.0.0",
    "num2words>=0.5.13",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydub>=0.25.1",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
app = [
    "gradio>=5.0.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
]
nlp = [
    "stanza>=1.8.0",
    "zeyrek>=0.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "core*"]

